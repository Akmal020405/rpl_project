{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RPL Django{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'mahasiswa/css/style.css' %}">
  <style>
    /* Tambahan gaya sederhana untuk menubar */
    body { margin: 0; font-family: Arial, sans-serif; background: #f8f8f8; }
    header { background: #0056b3; color: white; padding: 15px 20px; }
    header h1 { margin: 0; }
    nav {
      background: #004494;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin-right: 15px;
    }
    nav a:hover {
      text-decoration: underline;
    }
    .user-info {
      color: #ffeb3b;
      font-weight: bold;
    }
    main {
      padding: 20px;
    }
    footer {
      background: #ddd;
      padding: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>Praktikum RPL - Django</h1>
  </header>

  <!-- 🧭 Menu navigasi (menubar) -->
  <nav>
    <div>
      <a href="{% url 'daftar_mahasiswa' %}">Data Mahasiswa</a>
    </div>
    <div>
      {% if user.is_authenticated %}
        <span class="user-info">Hai, {{ user.username }}</span>
        <a href="{% url 'logout' %}">Logout</a>
      {% else %}
        <a href="{% url 'login' %}">Login</a>
      {% endif %}
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>&copy; 2025 - Praktikum</p>
  </footer>

  <script src="{% static 'mahasiswa/js/main.js' %}"></script>
</body>
</html>
